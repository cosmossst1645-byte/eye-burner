<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>EYE BURNER</title>
  <style>
    :root {
      --bg-void: #040406;
      --surface: #0d0d12;
      --surface-hover: #181822;
      --border-dim: #242433;
      --text-main: #ffffff;
      --accent-hot: #ff0055;
      --accent-acid: #00ff66;
      --accent-volt: #00e5ff;
      --accent-sun: #ffe600;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      width: 100%;
      height: 100%;
      background-color: var(--bg-void);
      color: var(--text-main);
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;
      overflow: hidden;
      touch-action: manipulation;
    }

    /* ==================== MENU LAYOUT ==================== */
    #menu {
      width: 100%;
      height: 100%;
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      grid-template-rows: auto repeat(5, minmax(0, 1fr));
      gap: 8px;
      padding: 10px;
      background:
        radial-gradient(circle at 15% 10%, rgba(255, 0, 85, 0.14), transparent 45%),
        radial-gradient(circle at 85% 90%, rgba(0, 229, 255, 0.14), transparent 45%),
        var(--bg-void);
      overflow-y: auto;
    }

    #brandHeader {
      grid-column: 1 / -1;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 8px 12px;
      background: rgba(16, 16, 24, 0.92);
      border: 1px solid var(--border-dim);
      border-radius: 8px;
    }

    #brandTitle {
      font-size: 1.05rem;
      font-weight: 900;
      letter-spacing: 3px;
      color: #ffffff;
      text-shadow: 0 0 12px rgba(255, 0, 85, 0.65);
    }

    #brandTag {
      font-size: 0.68rem;
      font-weight: 800;
      letter-spacing: 1.5px;
      color: var(--accent-sun);
      background: rgba(255, 230, 0, 0.1);
      border: 1px solid rgba(255, 230, 0, 0.35);
      padding: 3px 7px;
      border-radius: 4px;
    }

    .mode-btn {
      position: relative;
      background: linear-gradient(165deg, #12121a 0%, #09090e 100%);
      color: var(--text-main);
      border: 1.5px solid var(--border-dim);
      border-radius: 10px;
      padding: 10px 8px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 4px;
      cursor: pointer;
      overflow: hidden;
      transition: transform 0.05s ease, border-color 0.08s ease;
    }

    .mode-btn::before {
      content: "";
      position: absolute;
      inset: 0;
      opacity: 0.12;
      background: linear-gradient(135deg, var(--accent-hot), transparent 60%, var(--accent-volt));
      pointer-events: none;
    }

    .mode-btn:active {
      transform: scale(0.96);
      background: #ffffff;
      color: #000000;
      border-color: #ffffff;
    }

    .mode-btn:active .mode-num,
    .mode-btn:active .mode-sub {
      color: #000000;
    }

    .mode-num {
      font-size: 0.7rem;
      font-weight: 900;
      letter-spacing: 2px;
      color: var(--accent-volt);
    }

    .mode-name {
      font-size: 0.92rem;
      font-weight: 900;
      letter-spacing: 0.8px;
      text-transform: uppercase;
      text-align: center;
      line-height: 1.15;
    }

    .mode-sub {
      font-size: 0.62rem;
      font-weight: 700;
      letter-spacing: 0.6px;
      color: #9696ad;
      text-transform: uppercase;
    }

    .mode-btn[data-mode="10"] {
      border-color: rgba(255, 0, 85, 0.55);
    }

    .mode-btn[data-mode="10"] .mode-num {
      color: var(--accent-hot);
    }

    /* ==================== FULLSCREEN STAGE ==================== */
    #stage {
      display: none;
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
      z-index: 99999;
      overflow: hidden;
      background: #000000;
      transform-origin: center center;
      will-change: transform, filter, background-color;
    }

    #fxCanvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      display: block;
    }

    #overlayLayer {
      position: absolute;
      inset: 0;
      pointer-events: none;
      overflow: hidden;
    }

    .riot-shard {
      position: absolute;
      font-weight: 900;
      line-height: 1;
      will-change: transform, opacity;
      text-shadow: 0 0 8px currentColor;
    }
  </style>
</head>
<body>

  <main id="menu" aria-label="Eye Burner Mode Selector">
    <header id="brandHeader">
      <div id="brandTitle">EYE BURNER</div>
      <div id="brandTag">MAX // 3X TAP EXIT</div>
    </header>

    <button class="mode-btn" data-mode="1" type="button">
      <span class="mode-num">01</span>
      <span class="mode-name">Hyper Strobe</span>
      <span class="mode-sub">Raw Flash Assault</span>
    </button>

    <button class="mode-btn" data-mode="2" type="button">
      <span class="mode-num">02</span>
      <span class="mode-name">Neon Melt</span>
      <span class="mode-sub">Acid Plasma Warp</span>
    </button>

    <button class="mode-btn" data-mode="3" type="button">
      <span class="mode-num">03</span>
      <span class="mode-name">Pixel Shrapnel</span>
      <span class="mode-sub">Violent Grid Blast</span>
    </button>

    <button class="mode-btn" data-mode="4" type="button">
      <span class="mode-num">04</span>
      <span class="mode-name">Hypno Spiral</span>
      <span class="mode-sub">Optical Vortex Tunnel</span>
    </button>

    <button class="mode-btn" data-mode="5" type="button">
      <span class="mode-num">05</span>
      <span class="mode-name">Dead TV Static</span>
      <span class="mode-sub">Max Snow &amp; Scan</span>
    </button>

    <button class="mode-btn" data-mode="6" type="button">
      <span class="mode-num">06</span>
      <span class="mode-name">Laser Grid</span>
      <span class="mode-sub">Razor Beam Matrix</span>
    </button>

    <button class="mode-btn" data-mode="7" type="button">
      <span class="mode-num">07</span>
      <span class="mode-name">Confetti Riot</span>
      <span class="mode-sub">High-Speed Debris</span>
    </button>

    <button class="mode-btn" data-mode="8" type="button">
      <span class="mode-num">08</span>
      <span class="mode-name">Inverted Reality</span>
      <span class="mode-sub">Flip, Tilt &amp; Chromatic</span>
    </button>

    <button class="mode-btn" data-mode="9" type="button">
      <span class="mode-num">09</span>
      <span class="mode-name">Solar Flare</span>
      <span class="mode-sub">Core Detonation</span>
    </button>

    <button class="mode-btn" data-mode="10" type="button">
      <span class="mode-num">10</span>
      <span class="mode-name">Zenith Overload</span>
      <span class="mode-sub">All Systems Unhinged</span>
    </button>
  </main>

  <section id="stage" aria-hidden="true">
    <canvas id="fxCanvas"></canvas>
    <div id="overlayLayer"></div>
  </section>

  <script>
    "use strict";

    // ==================== DOM & ENGINE STATE ====================
    const menuEl = document.getElementById("menu");
    const stageEl = document.getElementById("stage");
    const canvas = document.getElementById("fxCanvas");
    const ctx = canvas.getContext("2d", { alpha: false, desynchronized: true });
    const overlayLayer = document.getElementById("overlayLayer");

    let viewW = window.innerWidth;
    let viewH = window.innerHeight;
    let dpr = Math.min(window.devicePixelRatio || 1, 2.5);

    let activeMode = 0;
    let frameCount = 0;
    let rafHandle = null;
    let turboTimer = null;
    let lastTime = 0;

    // Triple-tap anywhere on stage to return to menu
    let tapTimestamps = [];
    const TRIPLE_TAP_WINDOW_MS = 1000;

    // Color tables
    const PURE_STROBE = [
      "#ffffff",
      "#ff0000",
      "#00ffff",
      "#ffff00",
      "#ff00ff",
      "#00ff00",
      "#0000ff",
      "#000000"
    ];

    const ACID_PALETTE = [
      "#ff0055",
      "#00ff66",
      "#00e5ff",
      "#ffe600",
      "#ff00ff",
      "#ff4d00",
      "#7cff00",
      "#ffffff"
    ];

    const GLYPHS = ["⚡", "★", "▲", "◆", "✖", "✦", "☀", "■", "●", "▶", "◈", "✹"];

    // Pre-allocated object pools for high-speed modes
    const lasers = [];
    const shards = [];
    const MAX_SHARDS = 140;

    // ==================== CANVAS RESIZING ====================
    function syncViewport() {
      viewW = Math.max(1, window.innerWidth);
      viewH = Math.max(1, window.innerHeight);
      dpr = Math.min(window.devicePixelRatio || 1, 2.5);
      canvas.width = Math.floor(viewW * dpr);
      canvas.height = Math.floor(viewH * dpr);
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    }

    window.addEventListener("resize", syncViewport, { passive: true });
    window.addEventListener("orientationchange", () => {
      setTimeout(syncViewport, 80);
    }, { passive: true });
    syncViewport();

    // ==================== POOL INITIALIZATION ====================
    function initLasers() {
      lasers.length = 0;
      for (let i = 0; i < 36; i++) {
        lasers.push({
          x1: Math.random() * viewW,
          y1: Math.random() * viewH,
          x2: Math.random() * viewW,
          y2: Math.random() * viewH,
          vx1: (Math.random() - 0.5) * 44,
          vy1: (Math.random() - 0.5) * 44,
          vx2: (Math.random() - 0.5) * 44,
          vy2: (Math.random() - 0.5) * 44,
          width: 2 + (i % 5) * 1.5,
          colorIndex: i % ACID_PALETTE.length
        });
      }
    }

    function clearOverlayPool() {
      overlayLayer.innerHTML = "";
      shards.length = 0;
    }

    function pushShard(x, y, vx, vy, rot, vRot, size, color, glyph) {
      if (shards.length >= MAX_SHARDS) {
        const oldest = shards.shift();
        if (oldest && oldest.el && oldest.el.parentNode) {
          oldest.el.parentNode.removeChild(oldest.el);
        }
      }
      const el = document.createElement("div");
      el.className = "riot-shard";
      el.textContent = glyph;
      el.style.color = color;
      el.style.fontSize = `${size}px`;
      el.style.left = "0px";
      el.style.top = "0px";
      el.style.transform = `translate3d(${x}px, ${y}px, 0) rotate(${rot}deg)`;
      overlayLayer.appendChild(el);

      shards.push({ el, x, y, vx, vy, rot, vRot });
    }

    function updateShards(dtFactor) {
      for (let i = shards.length - 1; i >= 0; i--) {
        const s = shards[i];
        s.x += s.vx * dtFactor;
        s.y += s.vy * dtFactor;
        s.rot += s.vRot * dtFactor;

        if (s.x < -120 || s.x > viewW + 120 || s.y < -120 || s.y > viewH + 120) {
          if (s.el.parentNode) s.el.parentNode.removeChild(s.el);
          shards.splice(i, 1);
          continue;
        }
        s.el.style.transform = `translate3d(${s.x.toFixed(1)}px, ${s.y.toFixed(1)}px, 0) rotate(${s.rot.toFixed(1)}deg)`;
      }
    }

    function spawnBurstShards(count) {
      for (let i = 0; i < count; i++) {
        const edge = i % 4;
        let x = 0;
        let y = 0;
        if (edge === 0) { x = Math.random() * viewW; y = -30; }
        else if (edge === 1) { x = viewW + 30; y = Math.random() * viewH; }
        else if (edge === 2) { x = Math.random() * viewW; y = viewH + 30; }
        else { x = -30; y = Math.random() * viewH; }

        const angleToCenter = Math.atan2(viewH * 0.5 - y, viewW * 0.5 - x) + (Math.random() - 0.5) * 1.4;
        const speed = 14 + Math.random() * 28;
        pushShard(
          x,
          y,
          Math.cos(angleToCenter) * speed,
          Math.sin(angleToCenter) * speed,
          Math.random() * 360,
          (Math.random() - 0.5) * 45,
          22 + Math.random() * 46,
          ACID_PALETTE[(frameCount + i) % ACID_PALETTE.length],
          GLYPHS[(frameCount * 3 + i) % GLYPHS.length]
        );
      }
    }

    // ==================== MODE 1: HYPER STROBE ====================
    function renderHyperStrobe() {
      const idx = (frameCount * 3 + Math.floor(Math.random() * 4)) % PURE_STROBE.length;
      ctx.fillStyle = PURE_STROBE[idx];
      ctx.fillRect(0, 0, viewW, viewH);

      // High-contrast sub-bars for extreme retinal flicker
      const barCount = 6;
      const barH = viewH / barCount;
      for (let i = 0; i < barCount; i++) {
        if ((i + frameCount) % 2 === 0) {
          ctx.fillStyle = (i + frameCount) % 4 === 0 ? "#ffffff" : "#000000";
          ctx.fillRect(0, i * barH, viewW, barH);
        }
      }
    }

    // ==================== MODE 2: NEON MELT ====================
    function renderNeonMelt() {
      const baseHue = (frameCount * 37) % 360;
      const cx = viewW * (0.5 + 0.42 * Math.sin(frameCount * 0.41));
      const cy = viewH * (0.5 + 0.42 * Math.cos(frameCount * 0.49));
      const radius = Math.max(viewW, viewH) * 0.9;

      const grad = ctx.createRadialGradient(cx, cy, 8, viewW * 0.5, viewH * 0.5, radius);
      grad.addColorStop(0, `hsl(${baseHue}, 100%, 62%)`);
      grad.addColorStop(0.35, `hsl(${(baseHue + 95) % 360}, 100%, 55%)`);
      grad.addColorStop(0.7, `hsl(${(baseHue + 190) % 360}, 100%, 50%)`);
      grad.addColorStop(1, `hsl(${(baseHue + 285) % 360}, 100%, 58%)`);

      ctx.fillStyle = grad;
      ctx.fillRect(0, 0, viewW, viewH);

      // Melting wave bands
      ctx.save();
      for (let b = 0; b < 9; b++) {
        const yBase = ((b / 9) * viewH + frameCount * 24) % (viewH + 80) - 40;
        ctx.beginPath();
        ctx.moveTo(0, yBase);
        for (let x = 0; x <= viewW; x += 36) {
          const waveY = yBase + Math.sin(x * 0.03 + frameCount * 0.55 + b) * 26;
          ctx.lineTo(x, waveY);
        }
        ctx.strokeStyle = ACID_PALETTE[(frameCount + b) % ACID_PALETTE.length];
        ctx.lineWidth = 6;
        ctx.stroke();
      }
      ctx.restore();
    }

    // ==================== MODE 3: PIXEL SHRAPNEL ====================
    function renderPixelShrapnel() {
      ctx.fillStyle = frameCount % 2 === 0 ? "#000000" : "#ffffff";
      ctx.fillRect(0, 0, viewW, viewH);

      const cell = 16;
      const cols = Math.max(1, Math.floor(viewW / cell));
      const rows = Math.max(1, Math.floor(viewH / cell));
      const burstCount = 320;

      for (let i = 0; i < burstCount; i++) {
        const gx = Math.floor(Math.random() * cols) * cell;
        const gy = Math.floor(Math.random() * rows) * cell;
        const jx = (Math.random() - 0.5) * 26;
        const jy = (Math.random() - 0.5) * 26;
        const w = cell * (0.6 + Math.random() * 1.4);
        const h = cell * (0.6 + Math.random() * 1.4);

        ctx.fillStyle = ACID_PALETTE[Math.floor(Math.random() * ACID_PALETTE.length)];
        ctx.fillRect(gx + jx, gy + jy, w, h);
      }
    }

    // ==================== MODE 4: HYPNO SPIRAL ====================
    function renderHypnoSpiral() {
      ctx.fillStyle = "#000000";
      ctx.fillRect(0, 0, viewW, viewH);

      const cx = viewW * 0.5;
      const cy = viewH * 0.5;
      const maxR = Math.hypot(cx, cy) * 1.15;
      const arms = 12;
      const twist = frameCount * 0.36;

      // High-contrast pinwheel sectors
      for (let a = 0; a < arms; a++) {
        const a0 = (a / arms) * Math.PI * 2 + twist;
        const a1 = ((a + 0.5) / arms) * Math.PI * 2 + twist;
        ctx.beginPath();
        ctx.moveTo(cx, cy);
        ctx.arc(cx, cy, maxR, a0, a1);
        ctx.closePath();
        ctx.fillStyle = a % 2 === 0 ? "#ffffff" : ACID_PALETTE[(a + frameCount) % ACID_PALETTE.length];
        ctx.fill();
      }

      // Pulsing concentric shock rings
      const ringCount = 18;
      const phase = (frameCount * 16) % 44;
      for (let r = phase; r < maxR; r += 44) {
        ctx.beginPath();
        ctx.arc(cx, cy, Math.max(1, r), 0, Math.PI * 2);
        ctx.lineWidth = 6;
        ctx.strokeStyle = Math.floor(r / 44 + frameCount) % 2 === 0 ? "#000000" : "#00e5ff";
        ctx.stroke();
      }
    }

    // ==================== MODE 5: DEAD TV STATIC ====================
    function renderDeadStatic() {
      const bw = 6;
      const bh = 5;
      const cols = Math.ceil(viewW / bw);
      const rows = Math.ceil(viewH / bh);
      const rollOffset = (frameCount * 19) % Math.max(1, rows);

      for (let y = 0; y < rows; y++) {
        const isTearBand = ((y + rollOffset) % 29) < 4;
        const xShift = isTearBand ? ((frameCount * 37) % 40) - 20 : 0;

        for (let x = 0; x < cols; x++) {
          const r = Math.random();
          if (r < 0.42) {
            ctx.fillStyle = "#ffffff";
          } else if (r < 0.84) {
            ctx.fillStyle = "#000000";
          } else {
            ctx.fillStyle = ACID_PALETTE[Math.floor(Math.random() * ACID_PALETTE.length)];
          }
          ctx.fillRect(x * bw + xShift, y * bh, bw, bh);
        }
      }

      // Harsh horizontal scanline spikes
      for (let s = 0; s < 10; s++) {
        const sy = Math.random() * viewH;
        ctx.fillStyle = s % 2 === 0 ? "#ffffff" : "#ff0055";
        ctx.fillRect(0, sy, viewW, 2 + Math.random() * 4);
      }
    }

    // ==================== MODE 6: LASER GRID ====================
    function renderLaserGrid() {
      ctx.fillStyle = frameCount % 3 === 0 ? "#14001c" : "#000000";
      ctx.fillRect(0, 0, viewW, viewH);

      // Sweeping axis beams
      const sweepX = (frameCount * 47) % Math.max(1, viewW);
      const sweepY = (frameCount * 53) % Math.max(1, viewH);

      ctx.strokeStyle = "#00e5ff";
      ctx.lineWidth = 4;
      ctx.beginPath();
      ctx.moveTo(sweepX, 0);
      ctx.lineTo(sweepX, viewH);
      ctx.stroke();

      ctx.strokeStyle = "#ff0055";
      ctx.lineWidth = 4;
      ctx.beginPath();
      ctx.moveTo(0, sweepY);
      ctx.lineTo(viewW, sweepY);
      ctx.stroke();

      // Bouncing razor beams
      for (let i = 0; i < lasers.length; i++) {
        const ln = lasers[i];
        ln.x1 += ln.vx1;
        ln.y1 += ln.vy1;
        ln.x2 += ln.vx2;
        ln.y2 += ln.vy2;

        if (ln.x1 < 0 || ln.x1 > viewW) ln.vx1 *= -1;
        if (ln.y1 < 0 || ln.y1 > viewH) ln.vy1 *= -1;
        if (ln.x2 < 0 || ln.x2 > viewW) ln.vx2 *= -1;
        if (ln.y2 < 0 || ln.y2 > viewH) ln.vy2 *= -1;

        ctx.strokeStyle = ACID_PALETTE[(ln.colorIndex + frameCount) % ACID_PALETTE.length];
        ctx.lineWidth = ln.width;
        ctx.beginPath();
        ctx.moveTo(ln.x1, ln.y1);
        ctx.lineTo(ln.x2, ln.y2);
        ctx.stroke();
      }
    }

    // ==================== MODE 7: CONFETTI RIOT ====================
    function renderConfettiRiot(dtFactor) {
      ctx.fillStyle = ACID_PALETTE[(frameCount * 2) % ACID_PALETTE.length];
      ctx.fillRect(0, 0, viewW, viewH);

      // High-velocity canvas rectangles & diamonds
      for (let i = 0; i < 45; i++) {
        const x = Math.random() * viewW;
        const y = Math.random() * viewH;
        const w = 10 + Math.random() * 34;
        const h = 8 + Math.random() * 24;
        ctx.save();
        ctx.translate(x, y);
        ctx.rotate(Math.random() * Math.PI * 2);
        ctx.fillStyle = ACID_PALETTE[Math.floor(Math.random() * ACID_PALETTE.length)];
        ctx.fillRect(-w * 0.5, -h * 0.5, w, h);
        ctx.restore();
      }

      spawnBurstShards(12);
      updateShards(dtFactor);
    }

    // ==================== MODE 8: INVERTED REALITY ====================
    function renderInvertedReality() {
      renderNeonMelt();

      // Cutout geometric inversion blocks
      for (let i = 0; i < 6; i++) {
        const bw = 60 + Math.random() * (viewW * 0.45);
        const bh = 40 + Math.random() * (viewH * 0.35);
        const bx = Math.random() * Math.max(1, viewW - bw);
        const by = Math.random() * Math.max(1, viewH - bh);
        ctx.fillStyle = i % 2 === 0 ? "#000000" : "#ffffff";
        ctx.fillRect(bx, by, bw, bh);
      }

      const flip = frameCount % 2 === 0;
      const tilt = (frameCount % 2 === 0 ? 1 : -1) * (14 + (frameCount % 6) * 5);
      const scale = 1.2 + ((frameCount % 3) * 0.05);

      stageEl.style.filter = flip
        ? "invert(1) hue-rotate(180deg) contrast(320%) saturate(450%)"
        : "contrast(320%) saturate(450%) hue-rotate(90deg)";
      stageEl.style.transform = `scale(${scale}) rotate(${tilt}deg)`;
    }

    // ==================== MODE 9: SOLAR FLARE ====================
    function renderSolarFlare() {
      const cycle = (frameCount * 8) % 100;
      const t = cycle / 100;
      const cx = viewW * 0.5 + Math.sin(frameCount * 0.5) * 14;
      const cy = viewH * 0.5 + Math.cos(frameCount * 0.5) * 14;
      const maxDiag = Math.hypot(viewW, viewH) * 1.3;
      const coreRadius = Math.max(16, t * maxDiag);

      ctx.fillStyle = t > 0.72 ? "#ffffff" : "#1a0400";
      ctx.fillRect(0, 0, viewW, viewH);

      const flare = ctx.createRadialGradient(cx, cy, Math.max(2, coreRadius * 0.08), cx, cy, coreRadius);
      flare.addColorStop(0, "#ffffff");
      flare.addColorStop(0.28, "#fff700");
      flare.addColorStop(0.65, "#ff5500");
      flare.addColorStop(0.9, "#ff0044");
      flare.addColorStop(1, "rgba(0, 0, 0, 0)");

      ctx.fillStyle = flare;
      ctx.fillRect(0, 0, viewW, viewH);

      // Corona spikes
      ctx.save();
      ctx.translate(cx, cy);
      ctx.rotate(frameCount * 0.27);
      const rays = 16;
      for (let r = 0; r < rays; r++) {
        const angle = (r / rays) * Math.PI * 2;
        const len = maxDiag * (0.4 + 0.6 * Math.abs(Math.sin(frameCount * 0.4 + r)));
        ctx.strokeStyle = r % 2 === 0 ? "#ffffff" : "#ffe600";
        ctx.lineWidth = 4;
        ctx.beginPath();
        ctx.moveTo(0, 0);
        ctx.lineTo(Math.cos(angle) * len, Math.sin(angle) * len);
        ctx.stroke();
      }
      ctx.restore();
    }

    // ==================== MODE 10: ZENITH OVERLOAD ====================
    function renderZenithOverload(dtFactor) {
      const phase = frameCount % 5;
      if (phase === 0) renderHyperStrobe();
      else if (phase === 1) renderPixelShrapnel();
      else if (phase === 2) renderHypnoSpiral();
      else if (phase === 3) renderLaserGrid();
      else renderSolarFlare();

      // Cross-cutting neon slash
      ctx.strokeStyle = ACID_PALETTE[frameCount % ACID_PALETTE.length];
      ctx.lineWidth = 8;
      ctx.beginPath();
      ctx.moveTo(0, (frameCount * 71) % viewH);
      ctx.lineTo(viewW, viewH - ((frameCount * 71) % viewH));
      ctx.stroke();

      spawnBurstShards(8);
      updateShards(dtFactor);

      const dx = (Math.random() - 0.5) * 34;
      const dy = (Math.random() - 0.5) * 34;
      const rot = (Math.random() - 0.5) * 22;
      const sc = 1.12 + Math.random() * 0.14;

      stageEl.style.filter = frameCount % 2 === 0
        ? "invert(1) contrast(320%) saturate(450%)"
        : "contrast(320%) saturate(450%) hue-rotate(180deg)";
      stageEl.style.transform = `translate3d(${dx.toFixed(1)}px, ${dy.toFixed(1)}px, 0) rotate(${rot.toFixed(1)}deg) scale(${sc.toFixed(2)})`;
    }

    // ==================== MASTER LOOP & LIFECYCLE ====================
    function stepFrame(dtFactor) {
      frameCount += 1;
      switch (activeMode) {
        case 1:
          renderHyperStrobe();
          break;
        case 2:
          renderNeonMelt();
          break;
        case 3:
          renderPixelShrapnel();
          break;
        case 4:
          renderHypnoSpiral();
          break;
        case 5:
          renderDeadStatic();
          break;
        case 6:
          renderLaserGrid();
          break;
        case 7:
          renderConfettiRiot(dtFactor);
          break;
        case 8:
          renderInvertedReality();
          break;
        case 9:
          renderSolarFlare();
          break;
        case 10:
          renderZenithOverload(dtFactor);
          break;
      }
    }

    function stopAllEffects() {
      if (rafHandle !== null) {
        cancelAnimationFrame(rafHandle);
        rafHandle = null;
      }
      if (turboTimer !== null) {
        clearInterval(turboTimer);
        turboTimer = null;
      }
      clearOverlayPool();
      stageEl.style.filter = "none";
      stageEl.style.transform = "none";
      stageEl.style.backgroundColor = "#000000";
      syncViewport();
      ctx.fillStyle = "#000000";
      ctx.fillRect(0, 0, viewW, viewH);
    }

    function enterMode(modeNumber) {
      stopAllEffects();
      activeMode = modeNumber;
      frameCount = 0;
      tapTimestamps = [];
      lastTime = performance.now();

      if (modeNumber === 6 || modeNumber === 10) {
        initLasers();
      }

      menuEl.style.display = "none";
      stageEl.style.display = "block";
      stageEl.setAttribute("aria-hidden", "false");

      // Extra high-rate strobe injection on Mode 1 & Mode 10
      if (modeNumber === 1 || modeNumber === 10) {
        turboTimer = setInterval(() => {
          if (activeMode === 1) {
            frameCount += 1;
            renderHyperStrobe();
          } else if (activeMode === 10) {
            frameCount += 1;
            ctx.fillStyle = PURE_STROBE[frameCount % PURE_STROBE.length];
            ctx.fillRect(0, 0, viewW, viewH);
          }
        }, 14);
      }

      function tickLoop(now) {
        if (!activeMode) return;
        const elapsedMs = Math.min(50, Math.max(1, now - lastTime));
        lastTime = now;
        const dtFactor = elapsedMs / 16.667;

        stepFrame(dtFactor);
        rafHandle = requestAnimationFrame(tickLoop);
      }

      rafHandle = requestAnimationFrame(tickLoop);
    }

    function exitToMenu() {
      activeMode = 0;
      stopAllEffects();
      tapTimestamps = [];
      stageEl.style.display = "none";
      stageEl.setAttribute("aria-hidden", "true");
      menuEl.style.display = "grid";
    }

    // ==================== INPUT BINDINGS ====================
    document.querySelectorAll(".mode-btn").forEach((btn) => {
      btn.addEventListener("click", () => {
        const modeNum = Number(btn.getAttribute("data-mode"));
        if (modeNum >= 1 && modeNum <= 10) {
          enterMode(modeNum);
        }
      });
    });

    // Triple-tap anywhere on screen exits back to menu
    stageEl.addEventListener("pointerdown", (event) => {
      event.preventDefault();
      if (!activeMode) return;

      const now = performance.now();
      tapTimestamps.push(now);
      tapTimestamps = tapTimestamps.filter((t) => now - t <= TRIPLE_TAP_WINDOW_MS);

      if (tapTimestamps.length >= 3) {
        exitToMenu();
      }
    }, { passive: false });
  </script>
</body>
</html>
